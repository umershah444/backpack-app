services:
  # FastAPI backend (Python web service)
  - type: web
    name: backpack-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false        # set to your frontend URL in the Render dashboard

  # React (Vite) frontend served as a static site
  - type: web
    name: backpack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # set to your backpack-api URL in the Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
